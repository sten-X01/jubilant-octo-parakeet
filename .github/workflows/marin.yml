name: Yasmin

on:
  workflow_dispatch:
  repository_dispatch:
  # Optional self-heal (chain toot jaye to khud start): neeche 2 lines uncomment karo
  # schedule:
  #   - cron: '0 */6 * * *'

# cancel-in-progress: false -> naya run purane ke khatam hone ka wait karta hai
# (do jagah ek hi WhatsApp session chalne se bachta hai, aur final save adhoora nahi katta)
concurrency:
  group: marin-vps
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  TZ: Asia/Kolkata
  NODE_VERSION: '22'       # Node version yahan badlo
  RUN_MINUTES: '340'       # ek run ki length (GitHub hard limit = 360 min)
  AUTOSAVE_MINUTES: '30'   # har itne min me GitHub pe auto-save
  STATUS_MINUTES: '5'      # Discord status message refresh
  PANEL_USER: admin        # File Manager / Monitor ka username

jobs:
  ultimate-vps:
    name: 🌸 Marin VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
    - name: 📂 Checkout Code
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 1

    - name: 🧭 Init + Helper Commands
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
          set +e
          MH="$HOME/.marin"; mkdir -p "$MH/bin"
          NOW=$(date +%s)

          # ---- environment file (har SSH session + script isse padhta hai) ----
          {
            echo "export MARIN_HOME=\"$MH\""
            echo "export MARIN_DIR=\"$GITHUB_WORKSPACE\""
            echo "export TZ=Asia/Kolkata"
            echo "export REPO=\"$GITHUB_REPOSITORY\""
            echo "export BRANCH=\"$GITHUB_REF_NAME\""
            echo "export RUN_NUMBER=\"$GITHUB_RUN_NUMBER\""
            echo "export RUN_URL=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\""
            echo "export JOB_START=$NOW"
            echo "export DEADLINE=$((NOW + RUN_MINUTES * 60))"
            echo "export PANEL_USER=\"$PANEL_USER\""
            echo "export AUTOSAVE_MINUTES=$AUTOSAVE_MINUTES"
            echo "export STATUS_MINUTES=$STATUS_MINUTES"
            echo 'export PATH="$MARIN_HOME/bin:$PATH"'
          } > "$MH/env.sh"
          printf 'export DISCORD_WEBHOOK=%q\n' "$DISCORD_WEBHOOK" > "$MH/secrets.env"
          chmod 600 "$MH/secrets.env"

          # ---- helper commands ----
          cat > "$MH/lib.sh" <<'MARIN_EOF'
          # lib.sh - shared helpers (supervise / cloudflare url)
          MH="${MARIN_HOME:-$HOME/.marin}"

          # supervise NAME 'command'  -> background me chalao, crash ho to 3s baad restart
          supervise() {
            local name="$1"; shift
            setsid nohup bash -c "while true; do $* > \"$MH/$name.log\" 2>&1; sleep 3; done" >/dev/null 2>&1 &
          }

          # get_url LOGNAME -> trycloudflare URL (api.* ko ignore karke)
          get_url() {
            grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' "$MH/$1.log" 2>/dev/null | grep -v '^https://api\.' | head -n 1
          }

          # wait_url LOGNAME -> max 90s tak URL ka wait
          wait_url() {
            local i u
            for i in $(seq 1 45); do
              u=$(get_url "$1"); [ -n "$u" ] && { echo "$u"; return; }
              sleep 2
            done
          }

          write_urls() { # file_manager_url btop_url
            printf 'export FB_CF_URL=%q\nexport BTOP_CF_URL=%q\n' "$1" "$2" > "$MH/urls.env"
          }
          MARIN_EOF

          cat > "$MH/bin/vps-notify" <<'MARIN_EOF'
          #!/bin/bash
          # vps-notify - Discord notifier
          #   vps-notify boot "stage"        : booting progress (ek hi message edit hota hai)
          #   vps-notify online              : full status embed (post/edit)
          #   vps-notify update              : status embed refresh
          #   vps-notify offline "reason"    : status embed ko offline karo
          #   vps-notify event "title" "text" [green|red|yellow|blue|pink]
          MH="${MARIN_HOME:-$HOME/.marin}"
          for f in env.sh secrets.env state.env urls.env; do [ -f "$MH/$f" ] && . "$MH/$f"; done
          [ -f "$MH/path.sh" ] && . "$MH/path.sh"
          [ -z "$DISCORD_WEBHOOK" ] && exit 0

          color_of() {
            case "$1" in
              green) echo 5763719 ;; red) echo 15548997 ;; yellow) echo 16705372 ;;
              blue) echo 5793266 ;; grey) echo 9807270 ;; *) echo 16738740 ;;
            esac
          }

          field() { # name value [inline]
            jq -n --arg n "$1" --arg v "$2" --argjson i "${3:-false}" \
              '{name:$n, value:(if ($v|length)==0 then "-" else $v[0:1024] end), inline:$i}'
          }

          http_post()  { curl -s -m 25 -H 'Content-Type: application/json' -d "$1" "${DISCORD_WEBHOOK}?wait=true"; }
          http_patch() { curl -s -m 25 -X PATCH -H 'Content-Type: application/json' -d "$1" "${DISCORD_WEBHOOK}/messages/$2"; }

          send() { # payload  (DRY_RUN=1 sirf payload print karta hai)
            if [ -n "$DRY_RUN" ]; then echo "$1" | jq .; return; fi
            http_post "$1" > /dev/null
          }

          send_main() { # payload  -> main status message edit ya create
            [ -n "$DRY_RUN" ] && { echo "$1" | jq .; return; }
            local id res
            id=$(cat "$MH/msg_id" 2>/dev/null)
            if [ -n "$id" ]; then
              res=$(http_patch "$1" "$id")
              if echo "$res" | jq -e '.id' > /dev/null 2>&1; then return 0; fi
            fi
            res=$(http_post "$1")
            echo "$res" | jq -r '.id // empty' > "$MH/msg_id"
          }

          bots_text() {
            local out
            out=$(pm2 jlist 2>/dev/null | sed -n '/^\[/,$p' | jq -r '.[] |
              (if .pm2_env.status=="online" then "🟢" elif .pm2_env.status=="errored" then "🔴" else "🟡" end)
              + " **" + .name + "** · " + .pm2_env.status
              + " · " + (((.monit.memory // 0)/1048576)|floor|tostring) + "MB"
              + " · ↻" + (.pm2_env.restart_time|tostring)' 2>/dev/null)
            [ -z "$out" ] && out="_koi bot nahi chal raha_"
            printf '%s' "$out"
          }

          sys_text() {
            local cores load mem disk up
            cores=$(nproc 2>/dev/null)
            load=$(cut -d' ' -f1 /proc/loadavg 2>/dev/null)
            mem=$(free -m 2>/dev/null | awk '/Mem/{printf "%.1f / %.1f GB", $3/1024, $2/1024}')
            disk=$(df -h / 2>/dev/null | awk 'NR==2{print $3" / "$2" ("$5")"}')
            up=$(uptime -p 2>/dev/null | sed 's/^up //')
            printf '🧠 CPU load **%s** (%s cores)\n💾 RAM **%s**\n💽 Disk **%s**\n⏱️ Uptime **%s**' "$load" "$cores" "$mem" "$disk" "$up"
          }

          tools_text() {
            local n b p d f y
            n=$(node -v 2>/dev/null); b=$(bun -v 2>/dev/null)
            p=$(python3 -V 2>&1 | awk '{print $2}')
            d=$(deno --version 2>/dev/null | awk 'NR==1{print $2}')
            f=$(ffmpeg -version 2>/dev/null | awk 'NR==1{print $3}')
            y=$(yt-dlp --version 2>/dev/null)
            printf 'Node `%s` · Bun `%s` · Python `%s`\nDeno `%s` · ffmpeg `%s` · yt-dlp `%s`' "${n:--}" "${b:--}" "${p:--}" "${d:--}" "${f:--}" "${y:--}"
          }

          footer() { printf 'Marin VPS • Run #%s • %s' "${RUN_NUMBER:-?}" "$(TZ=Asia/Kolkata date '+%d %b %H:%M IST')"; }

          status_embed() { # mode: online|offline  [reason]
            local mode="$1" reason="$2" title desc col ssh fb bt save last
            local now left
            now=$(date +%s); left=$(( ${DEADLINE:-$now} - now )); [ "$left" -lt 0 ] && left=0

            if [ "$mode" = "online" ]; then
              title="🌸 Marin VPS • Online"; col=$(color_of green)
              desc="⏳ Session khatam hoga <t:${DEADLINE}:R> (<t:${DEADLINE}:t> IST)\n🚀 Start hua <t:${JOB_START}:R> • [Run #${RUN_NUMBER}](${RUN_URL})"
            else
              title="🌙 Marin VPS • Offline"; col=$(color_of grey)
              desc="${reason:-Session khatam.}\n[Run #${RUN_NUMBER}](${RUN_URL})"
            fi

            if [ -n "$TS_IP" ]; then
              ssh="\`ssh runner@${TS_HOST}\`\n\`ssh runner@${TS_IP}\`\n🔑 Password: \`SSH_PASSWORD\` secret\n_Phone/PC me Tailscale ON hona chahiye_"
            else
              ssh="⚠️ Tailscale connect nahi hua. \`TS_AUTHKEY\` check karo."
            fi

            fb="👤 \`${PANEL_USER}\` · 🔑 ${PANEL_PASS_HINT:-SSH_PASSWORD}\n"
            [ -n "$TS_IP" ]     && fb="${fb}🔒 http://${TS_IP}:8080\n"
            [ -n "$FB_CF_URL" ] && fb="${fb}🌐 ${FB_CF_URL}"
            bt="👤 \`${PANEL_USER}\` · read-only\n"
            [ -n "$TS_IP" ]     && bt="${bt}🔒 http://${TS_IP}:61208\n"
            [ -n "$BTOP_CF_URL" ] && bt="${bt}🌐 ${BTOP_CF_URL}"

            last=$(cat "$MH/last_save" 2>/dev/null)
            if [ -n "$last" ]; then save="Last: <t:${last}:R>"; else save="Abhi tak nahi"; fi
            save="${save}\nHar ${AUTOSAVE_MINUTES:-30} min auto • \`savecode\`"

            local fields
            fields=$( {
              field "🤖 Bots" "$(bots_text)" false
              field "💻 SSH (Tailscale)" "$(printf '%b' "$ssh")" false
              field "📂 File Manager" "$(printf '%b' "$fb")" true
              field "📊 System Monitor" "$(printf '%b' "$bt")" true
              field "⚙️ System" "$(sys_text)" false
              field "🧰 Tools" "$(tools_text)" false
              field "💾 Auto-Save" "$(printf '%b' "$save")" true
              field "🛠️ Commands" '`vps-info` · `pm2 status` · `pm2 logs NAME`
          `pm2 restart NAME` · `savecode`' true
            } | jq -s . )

            jq -n --arg title "$title" --arg desc "$(printf '%b' "$desc")" --argjson col "$col" \
                  --argjson fields "$fields" --arg foot "$(footer)" \
              '{username:"Marin VPS", embeds:[{title:$title, description:$desc, color:$col, fields:$fields,
                footer:{text:$foot}, timestamp:(now|floor|todate)}]}'
          }

          case "$1" in
            boot)
              echo "$2" >> "$MH/boot.log"
              lines=$(awk '{a[NR]=$0} END{for(i=1;i<NR;i++) print "✅ " a[i]; if(NR) print "⏳ " a[NR]}' "$MH/boot.log")
              send_main "$(jq -n --arg d "$lines" --arg foot "$(footer)" --argjson c "$(color_of yellow)" \
                '{username:"Marin VPS", embeds:[{title:"🔧 Marin VPS • Booting...", description:$d, color:$c,
                  footer:{text:$foot}, timestamp:(now|floor|todate)}]}')"
              ;;
            online|update) send_main "$(status_embed online)" ;;
            offline)       send_main "$(status_embed offline "$2")" ;;
            event)
              send "$(jq -n --arg t "$2" --arg d "$3" --argjson c "$(color_of "${4:-pink}")" --arg foot "$(footer)" \
                '{username:"Marin VPS", embeds:[{title:$t, description:$d, color:$c, footer:{text:$foot},
                  timestamp:(now|floor|todate)}]}')"
              ;;
            *) echo "usage: vps-notify boot|online|update|offline|event" ; exit 1 ;;
          esac
          MARIN_EOF

          cat > "$MH/bin/savecode" <<'MARIN_EOF'
          #!/bin/bash
          # savecode - saari bots/files GitHub pe save karta hai (retry + size guard + lock)
          #   savecode            : save + output dikhao
          #   savecode --quiet    : chup-chap (auto-save ke liye)
          #   savecode --notify   : result Discord pe bhi bhejo
          MH="${MARIN_HOME:-$HOME/.marin}"
          for f in env.sh secrets.env; do [ -f "$MH/$f" ] && . "$MH/$f"; done
          [ -f "$MH/path.sh" ] && . "$MH/path.sh"

          QUIET=0; NOTIFY=0
          for a in "$@"; do
            [ "$a" = "--quiet" ] && QUIET=1
            [ "$a" = "--notify" ] && NOTIFY=1
          done
          say() { [ "$QUIET" = 1 ] || echo -e "$@"; }

          cd "${MARIN_DIR:-.}" || { echo "MARIN_DIR nahi mila"; exit 1; }

          exec 9>/tmp/savecode.lock
          flock -w 180 9 || { say "⏳ Dusra save chal raha hai, skip."; exit 0; }

          say "⏳ Saving ALL BOTS to GitHub..."

          # 95MB se bade files GitHub reject karta hai -> skip
          find . -path ./.git -prune -o -type f -size +95M -print 2>/dev/null | sed 's|^\./||' >> .git/info/exclude
          sort -u .git/info/exclude -o .git/info/exclude

          git add -A -- . ':!.github' 2>/dev/null

          if git diff --cached --quiet; then
            date +%s > "$MH/last_save"
            say "✅ Kuch naya nahi tha, sab already saved."
            [ "$NOTIFY" = 1 ] && vps-notify event "💾 Save" "Kuch naya nahi tha, sab already saved." blue
            exit 0
          fi

          FILES=$(git diff --cached --name-only | wc -l)
          git commit -q -m "💾 Auto-save • $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST') • run #${RUN_NUMBER:-0} [skip ci]" || exit 1

          ok=0
          for i in 1 2 3 4; do
            if git push -q origin "HEAD:${BRANCH:-main}" 2>/tmp/savecode.err; then ok=1; break; fi
            say "⚠️ Push fail (try $i), sync karke dobara..."
            if ! git pull -q --rebase -X theirs origin "${BRANCH:-main}" 2>>/tmp/savecode.err; then
              git rebase --abort 2>/dev/null
              git fetch -q --unshallow 2>/dev/null
            fi
            sleep 3
          done

          if [ "$ok" = 1 ]; then
            date +%s > "$MH/last_save"
            say "✅ Save complete ($FILES files)."
            [ "$NOTIFY" = 1 ] && vps-notify event "💾 Saved to GitHub" "$FILES files save hui." green
            exit 0
          fi

          say "❌ Push fail hua. Check: PAT_TOKEN (repo + workflow scope?)"
          vps-notify event "❌ Save failed" "Push 4 baar fail hua. \`PAT_TOKEN\` ya conflict check karo.\n\`\`\`$(tail -n 3 /tmp/savecode.err | cut -c1-300)\`\`\`" red
          exit 1
          MARIN_EOF

          cat > "$MH/bin/vps-info" <<'MARIN_EOF'
          #!/bin/bash
          # vps-info - VPS dashboard (SSH login pe apne aap dikhta hai)
          MH="${MARIN_HOME:-$HOME/.marin}"
          for f in env.sh state.env urls.env; do [ -f "$MH/$f" ] && . "$MH/$f"; done
          [ -f "$MH/path.sh" ] && . "$MH/path.sh"

          R=$'\e[0m'; PK=$'\e[1;35m'; CY=$'\e[1;36m'; YL=$'\e[1;33m'; DM=$'\e[2m'
          now=$(date +%s); left=$(( ${DEADLINE:-$now} - now )); [ "$left" -lt 0 ] && left=0
          end=$(TZ=Asia/Kolkata date -d "@${DEADLINE:-$now}" '+%H:%M IST')
          last=$(cat "$MH/last_save" 2>/dev/null)
          if [ -n "$last" ]; then lastv="$(( (now - last) / 60 )) min pehle"; else lastv="abhi tak nahi"; fi

          echo
          echo "${PK}  🌸 Marin VPS${R}  ${DM}run #${RUN_NUMBER:-?} • ${BRANCH:-main}${R}"
          echo "${DM}  ─────────────────────────────────────────────${R}"
          printf '  %s⏳ Session%s   %sh %sm baaki (end: %s)\n' "$YL" "$R" "$((left/3600))" "$(((left%3600)/60))" "$end"
          printf '  %s💾 Last save%s %s  %s(auto har %s min)%s\n' "$YL" "$R" "$lastv" "$DM" "${AUTOSAVE_MINUTES:-30}" "$R"
          printf '  %s🧠 CPU/RAM%s   load %s • %s\n' "$YL" "$R" "$(cut -d' ' -f1 /proc/loadavg)" "$(free -m | awk '/Mem/{printf "%.1f/%.1f GB", $3/1024, $2/1024}')"
          printf '  %s💽 Disk%s      %s\n' "$YL" "$R" "$(df -h / | awk 'NR==2{print $3" / "$2" ("$5")"}')"
          echo
          echo "${CY}  🌐 Access${R}"
          [ -n "$TS_IP" ] && echo "   📂 Files   http://${TS_IP}:8080   ${DM}(admin)${R}"
          [ -n "$TS_IP" ] && echo "   📊 Monitor http://${TS_IP}:61208  ${DM}(admin)${R}"
          [ -n "$FB_CF_URL" ]   && echo "   🌐 Files   ${FB_CF_URL}"
          [ -n "$BTOP_CF_URL" ] && echo "   🌐 Monitor ${BTOP_CF_URL}"
          echo
          echo "${CY}  🤖 Bots${R}"
          pm2 jlist 2>/dev/null | sed -n '/^\[/,$p' | jq -r '.[] | "   " + (if .pm2_env.status=="online" then "🟢" elif .pm2_env.status=="errored" then "🔴" else "🟡" end) + " " + .name + "  " + .pm2_env.status + "  " + (((.monit.memory // 0)/1048576)|floor|tostring) + "MB  ↻" + (.pm2_env.restart_time|tostring)' 2>/dev/null || echo "   (pm2 nahi mila)"
          echo
          echo "${CY}  🛠️  Commands${R}"
          echo "   pm2 status | pm2 logs NAME | pm2 restart NAME | pm2 stop NAME"
          echo "   savecode      ${DM}(GitHub pe save)${R}   bd ${DM}(bots folder)${R}   vps-info ${DM}(ye screen)${R}"
          echo
          MARIN_EOF
          chmod +x "$MH"/bin/*

          # ---- git: identity, safe dir, junk ko save se bahar rakho ----
          git config --global user.email "marin-bot@auto.sync"
          git config --global user.name "Marin Auto-Saver"
          git config --global --add safe.directory '*'
          git config --global pull.rebase true
          git config --global http.postBuffer 524288000
          cat >> .git/info/exclude <<'MARIN_EOF'
          node_modules/
          .venv/
          venv/
          __pycache__/
          *.pyc
          *.log
          .cache/
          .npm/
          core.[0-9]*
          MARIN_EOF

          . "$MH/env.sh"
          vps-notify boot "Runner ready (Init + helper commands)"
          exit 0

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 🥟 Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: ⚡ Restore Dependency Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          ~/.bun/install/cache
          ~/.cache/pip
          ~/.cache/uv
        key: deps-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/bun.lockb', '**/requirements.txt') }}
        restore-keys: |
          deps-${{ runner.os }}-

    - name: 🧰 System Tools + Runtimes
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
          set +e
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          . "$HOME/.marin/env.sh"
          MH="$MARIN_HOME"
          vps-notify boot "System tools + runtimes install ho rahe hain"

          # ---- timezone, kernel tuning, swap ----
          sudo ln -sf /usr/share/zoneinfo/Asia/Kolkata /etc/localtime
          sudo sysctl -w net.core.rmem_max=7500000 net.core.wmem_max=7500000 fs.inotify.max_user_watches=524288 > /dev/null 2>&1
          if [ "$(swapon --show --noheadings | wc -l)" = "0" ]; then
            sudo fallocate -l 4G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile > /dev/null && sudo swapon /swapfile
          fi

          # ---- apt: essentials ----
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick webp jq git curl wget unzip zip build-essential \
            python3 python3-pip python3-venv openssh-server ttyd btop neofetch

          # ---- apt: nice-to-have (ek fail ho to baaki na ruke) ----
          for p in pipx p7zip-full tmux htop ncdu tree nano vim ripgrep fd-find fzf bat sqlite3 rsync lsof \
                   net-tools dnsutils libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev \
                   fonts-noto-color-emoji; do
            sudo apt-get install -y -qq "$p" > /dev/null 2>&1 || echo "skip: $p"
          done

          # ---- yt-dlp + Deno (JS runtime) ----
          sudo curl -fsSL --retry 3 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          curl -fsSL https://deno.land/install.sh | sh > /dev/null 2>&1
          sudo ln -sf "$HOME/.deno/bin/deno" /usr/local/bin/deno

          # ---- cloudflared, filebrowser, tailscale ----
          wget -q -O /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb > /dev/null 2>&1
          rm -f /tmp/cloudflared.deb
          curl -fsSL https://raw.githubusercontent.com/filebrowser/get/master/get.sh | sudo bash > /dev/null 2>&1
          curl -fsSL https://tailscale.com/install.sh | sh > /dev/null 2>&1

          # ---- node globals (pm2, pnpm, yarn) + python tools (uv) ----
          sudo env "PATH=$PATH" npm install -g pm2 pnpm yarn --no-fund --no-audit --loglevel=error
          python3 -m pip install --user --break-system-packages -q uv 2>/dev/null

          # ---- PATH: SSH login shells me bhi node/bun/python/deno mile ----
          NODE_BIN=$(dirname "$(command -v node)")
          BUN_BIN=$(dirname "$(command -v bun)")
          {
            echo "export PATH=\"$NODE_BIN:$BUN_BIN:\$HOME/.bun/bin:\$HOME/.deno/bin:\$HOME/.local/bin:\$PATH\""
            echo 'export DENO_INSTALL="$HOME/.deno"'
            echo 'export PIP_BREAK_SYSTEM_PACKAGES=1'
            echo 'export PIP_DISABLE_PIP_VERSION_CHECK=1'
          } > "$MH/path.sh"
          . "$MH/path.sh"

          # bashrc: top pe PATH/env (non-interactive ssh commands ke liye), end pe cute prompt + banner
          {
            echo '[ -f "$HOME/.marin/env.sh" ] && . "$HOME/.marin/env.sh"'
            echo '[ -f "$HOME/.marin/path.sh" ] && . "$HOME/.marin/path.sh"'
            cat "$HOME/.bashrc"
          } > /tmp/bashrc.new && mv /tmp/bashrc.new "$HOME/.bashrc"
          cat >> "$HOME/.bashrc" <<'MARIN_EOF'

          # --- 🌸 Marin VPS ---
          export PS1='\[\e[1;35m\]🌸 marin\[\e[0m\] \[\e[1;34m\]\w\[\e[0m\] \[\e[1;32m\]❯\[\e[0m\] '
          alias ll='ls -lah --color=auto'
          alias bd='cd "$MARIN_DIR"'
          alias bots='pm2 status'
          alias logs='pm2 logs'
          alias fd='fdfind'
          alias bat='batcat'
          if [[ $- == *i* ]]; then
            [ "$PWD" = "$HOME" ] && cd "$MARIN_DIR" 2>/dev/null
            [ -n "$SSH_TTY" ] && vps-info
          fi
          MARIN_EOF

          # ---- GitHub CLI login (gh pehle se runner me hai) ----
          echo "$PAT_TOKEN" | gh auth login --with-token 2>/dev/null

          echo "=== VERSIONS ==="
          node -v; bun -v; python3 -V; deno --version | head -n 1; ffmpeg -version | head -n 1
          yt-dlp --version; pm2 -v; tailscale version | head -n 1; filebrowser version; cloudflared --version
          exit 0

    - name: 🚀 Start All Bots (PM2)
      run: |
          set +e
          . "$HOME/.marin/env.sh"; . "$HOME/.marin/path.sh"
          MH="$MARIN_HOME"
          vps-notify boot "Bots install + start ho rahe hain"
          ulimit -n 65535 2>/dev/null
          cd "$MARIN_DIR" || exit 1

          PM2_OPTS="--time --restart-delay 3000"
          BOT_LIST=""; FAILED=""

          for dir in */ ; do
            dir=${dir%/}
            [ -f "$dir/.nobot" ] && continue
            case "$dir" in node_modules|.github) continue ;; esac

            if [ -f "$dir/package.json" ]; then
              # ---------- Node / Bun bot ----------
              BOT_LIST="${BOT_LIST:+$BOT_LIST, }$dir"
              echo "⚙️ Initializing Bot: $dir"
              cd "$dir" || continue
              if grep -q '"bun":' package.json; then
                echo "🥟 Bun detected"
                bun install --silent || FAILED="$FAILED $dir"
                if [ -f "src/main.js" ]; then
                  pm2 start "bun run --smol src/main.js" --name "$dir" $PM2_OPTS
                else
                  pm2 start "bun start" --name "$dir" $PM2_OPTS
                fi
              else
                echo "🟢 Node detected"
                npm install --no-audit --no-fund --loglevel=error || FAILED="$FAILED $dir"
                if [ -f "index.js" ]; then
                  pm2 start index.js --name "$dir" $PM2_OPTS
                else
                  pm2 start npm --name "$dir" $PM2_OPTS -- start
                fi
              fi
              cd "$MARIN_DIR" || exit 1

            elif [ -f "$dir/requirements.txt" ]; then
              # ---------- Python bot ----------
              ENTRY=""
              for f in main.py bot.py app.py run.py index.py; do
                [ -f "$dir/$f" ] && { ENTRY="$f"; break; }
              done
              [ -z "$ENTRY" ] && continue
              BOT_LIST="${BOT_LIST:+$BOT_LIST, }$dir"
              echo "🐍 Python bot: $dir ($ENTRY)"
              cd "$dir" || continue
              python3 -m venv .venv && ./.venv/bin/pip install -q -r requirements.txt || FAILED="$FAILED $dir"
              pm2 start "$ENTRY" --name "$dir" --interpreter "$PWD/.venv/bin/python" $PM2_OPTS
              cd "$MARIN_DIR" || exit 1
            fi
          done

          # pm2 logs ko bade hone se roko
          pm2 install pm2-logrotate > /dev/null 2>&1
          pm2 set pm2-logrotate:max_size 20M > /dev/null 2>&1
          pm2 set pm2-logrotate:retain 3 > /dev/null 2>&1
          pm2 save

          echo "Active bots: ${BOT_LIST:-none}"
          if [ -n "$FAILED" ]; then
            vps-notify event "⚠️ Dependency install fail" "Ye bots ke packages install nahi hue:\`$FAILED\`" yellow
          fi
          if [ -z "$BOT_LIST" ]; then
            vps-notify event "ℹ️ Koi bot nahi mila" "Repo me \`package.json\` ya \`requirements.txt\` wala folder nahi hai." blue
          fi
          exit 0

    - name: 🌐 Network (SSH + Tailscale + Panels)
      env:
        TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
      run: |
          set +e
          . "$HOME/.marin/env.sh"; . "$HOME/.marin/path.sh"; . "$HOME/.marin/lib.sh"
          MH="$MARIN_HOME"
          vps-notify boot "Network + access (SSH, Tailscale, panels)"

          # ---------- sshd ----------
          if [ -n "$SSH_PASSWORD" ]; then
            echo "runner:$SSH_PASSWORD" | sudo chpasswd
          else
            vps-notify event "⚠️ SSH_PASSWORD khaali hai" "Password login nahi chalega. Secret set karo ya \`SSH_PUBKEY\` use karo." yellow
          fi
          if [ -n "$SSH_PUBKEY" ]; then
            mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
            echo "$SSH_PUBKEY" >> "$HOME/.ssh/authorized_keys" && chmod 600 "$HOME/.ssh/authorized_keys"
          fi
          sudo mkdir -p /run/sshd
          printf '%s\n' 'PasswordAuthentication yes' 'PermitRootLogin no' 'ClientAliveInterval 60' \
            'ClientAliveCountMax 10' 'MaxAuthTries 4' | sudo tee /etc/ssh/sshd_config.d/00-marin.conf > /dev/null
          sudo service ssh restart || sudo /usr/sbin/sshd

          # ---------- Tailscale ----------
          TS_IP=""; TS_HOST=""
          if [ -n "$TS_AUTHKEY" ]; then
            sudo tailscale up --authkey="$TS_AUTHKEY" --hostname=marin-vps --accept-dns=false
            for i in $(seq 1 15); do
              TS_IP=$(tailscale ip -4 2>/dev/null | head -n 1); [ -n "$TS_IP" ] && break; sleep 2
            done
            TS_HOST=$(tailscale status --json 2>/dev/null | jq -r '.Self.HostName // empty')
            tailscale status
          else
            vps-notify event "⚠️ TS_AUTHKEY missing" "Tailscale secret set nahi hai, SSH nahi milega." yellow
          fi

          # ---------- Panels (login ke saath) ----------
          PANEL_PASS="$SSH_PASSWORD"; PANEL_HINT="SSH_PASSWORD"
          FBDB="$MH/filebrowser.db"
          filebrowser -d "$FBDB" config init > /dev/null 2>&1
          if ! filebrowser -d "$FBDB" users add "$PANEL_USER" "$PANEL_PASS" --perm.admin > /dev/null 2>&1; then
            # password chhota/khaali ho to random bana do (Discord pe dikhega)
            PANEL_PASS=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 20)
            filebrowser -d "$FBDB" users add "$PANEL_USER" "$PANEL_PASS" --perm.admin > /dev/null 2>&1
            PANEL_HINT="\`$PANEL_PASS\`"
          fi
          export PANEL_PASS

          supervise filebrowser 'filebrowser -a 0.0.0.0 -p 8080 -r "$MARIN_DIR" -d "$MARIN_HOME/filebrowser.db"'
          supervise btop 'ttyd -p 61208 -c "$PANEL_USER:$PANEL_PASS" btop'
          sleep 3
          supervise cf_fb 'cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080'
          supervise cf_btop 'cloudflared tunnel --no-autoupdate --url http://127.0.0.1:61208'

          FB_URL=$(wait_url cf_fb)
          BTOP_URL=$(wait_url cf_btop)
          write_urls "$FB_URL" "$BTOP_URL"
          echo "Files: ${FB_URL:-none} | Monitor: ${BTOP_URL:-none}"

          {
            printf 'export TS_IP=%q\n' "$TS_IP"
            printf 'export TS_HOST=%q\n' "${TS_HOST:-marin-vps}"
            printf 'export PANEL_PASS_HINT=%q\n' "$PANEL_HINT"
          } > "$MH/state.env"
          exit 0

    - name: 💚 Go Online + Keep-Alive
      env:
        TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      run: |
          set +e
          . "$HOME/.marin/env.sh"; . "$HOME/.marin/path.sh"; . "$HOME/.marin/lib.sh"
          . "$MARIN_HOME/state.env"
          MH="$MARIN_HOME"

          vps-notify online
          echo "RESTART_SAFE=true" >> "$GITHUB_ENV"
          vps-info

          NOW=$(date +%s); T_SAVE=$NOW; T_UPD=$NOW; T_YT=$NOW
          declare -A NOTIFIED

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 30
            NOW=$(date +%s)

            # --- Tailscale / sshd watchdog ---
            if [ -n "$TS_AUTHKEY" ] && [ -z "$(tailscale ip -4 2>/dev/null | head -n 1)" ]; then
              sudo tailscale up --authkey="$TS_AUTHKEY" --hostname=marin-vps --accept-dns=false > /dev/null 2>&1
            fi
            pgrep -x sshd > /dev/null || sudo service ssh start > /dev/null 2>&1

            # --- Cloudflare URL badal gaya? ---
            . "$MH/urls.env"
            NF=$(get_url cf_fb); NB=$(get_url cf_btop)
            if { [ -n "$NF" ] && [ "$NF" != "$FB_CF_URL" ]; } || { [ -n "$NB" ] && [ "$NB" != "$BTOP_CF_URL" ]; }; then
              write_urls "${NF:-$FB_CF_URL}" "${NB:-$BTOP_CF_URL}"
              vps-notify event "🌐 Public URL badla" "File Manager / Monitor ka naya link status message me hai." blue
              vps-notify update
              T_UPD=$NOW
            fi

            # --- crashed (errored) bots ---
            ERRORED=$(pm2 jlist 2>/dev/null | sed -n '/^\[/,$p' | jq -r '.[] | select(.pm2_env.status=="errored") | .name' 2>/dev/null)
            for b in $ERRORED; do
              if [ $(( NOW - ${NOTIFIED[$b]:-0} )) -gt 600 ]; then
                pm2 restart "$b" > /dev/null 2>&1
                vps-notify event "🔴 Bot crash" "\`$b\` errored tha, restart kar diya.\nLogs: \`pm2 logs $b\`" red
                NOTIFIED[$b]=$NOW
              fi
            done

            # --- auto-save ---
            if [ $(( NOW - T_SAVE )) -ge $(( AUTOSAVE_MINUTES * 60 )) ]; then
              savecode --quiet
              T_SAVE=$NOW
            fi

            # --- live status message refresh ---
            if [ $(( NOW - T_UPD )) -ge $(( STATUS_MINUTES * 60 )) ]; then
              vps-notify update
              T_UPD=$NOW
            fi

            # --- yt-dlp har 3 ghante me update ---
            if [ $(( NOW - T_YT )) -ge 10800 ]; then
              sudo yt-dlp -U > /dev/null 2>&1
              T_YT=$NOW
            fi
          done
          echo "⏰ Session time pura hua."
          exit 0

    - name: 💾 Final Save + Shutdown
      if: always()
      env:
        JOB_STATUS: ${{ job.status }}
      run: |
          set +e
          [ -f "$HOME/.marin/env.sh" ] || exit 0
          . "$HOME/.marin/env.sh"; . "$HOME/.marin/path.sh"
          [ -f "$MARIN_HOME/state.env" ] && . "$MARIN_HOME/state.env"
          [ -f "$MARIN_HOME/urls.env" ] && . "$MARIN_HOME/urls.env"

          vps-notify event "⏰ Session ending" "Bots band karke final save ho rahi hai..." yellow
          pm2 stop all > /dev/null 2>&1
          sleep 3
          savecode --notify

          if [ "$JOB_STATUS" = "cancelled" ]; then
            R="🛑 Workflow cancel hua. Auto-restart nahi hoga."
          elif [ "$RESTART_SAFE" = "true" ]; then
            R="🔁 Naya run apne aap start hoga (~5 min me online)."
          else
            R="⚠️ Run setup me fail hua. Actions logs check karo."
          fi
          vps-notify offline "$R"
          sudo tailscale logout > /dev/null 2>&1
          exit 0

    - name: 🔁 Respawn Next Run
      if: ${{ !cancelled() && env.RESTART_SAFE == 'true' }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.PAT_TOKEN }}
        script: |
          const wf = process.env.GITHUB_WORKFLOW_REF.split('@')[0].split('/').pop();
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: wf,
            ref: process.env.GITHUB_REF_NAME
          });
