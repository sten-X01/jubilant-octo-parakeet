name: Yasmin

on:
  workflow_dispatch:
  repository_dispatch:

concurrency:
  group: marin-vps
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  TZ: 'Asia/Kolkata'

jobs:
  ultimate-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
    - name: 📂 Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0

    - name: 🟢 Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 🥟 Setup Bun Runtime
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: 🧹 System Cleanup & Install Pro Tools
      run: |
        echo "🧹 Clearing Disk Space..."
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg imagemagick webp jq tmate neofetch ttyd btop python3 python3-pip

        # --- 📥 YT-DLP + JS RUNTIME FIX ---
        sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp

        # Install Deno (yt-dlp preferred JS runtime)
        curl -fsSL https://deno.land/install.sh | sh
        sudo ln -sf /home/runner/.deno/bin/deno /usr/local/bin/deno

    - name: 🍪 Create Cookies File
      run: |
        echo "${{ secrets.YT_COOKIES }}" > cookies.txt

        # 🛡️ INSTALL & DEEP CLEAN JUNK
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb

        find . -name "cloudflared-linux-amd64.deb" -type f -delete

        sudo npm install -g pm2
        curl -fsSL https://raw.githubusercontent.com/filebrowser/get/master/get.sh | sudo bash
        ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519

    - name: 💾 Setup Ghost Auto-Save (savecode)
      run: |
        git config --global user.email "marin-bot@auto.sync"
        git config --global user.name "Marin Auto-Saver"
        git remote set-url origin https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git

        echo "**/node_modules/" >> .gitignore
        echo "**/*.log" >> .gitignore
        echo "filebrowser.db" >> .gitignore
        echo "cookies.txt" >> .gitignore

        mv .github /tmp/.github_hidden

        echo '#!/bin/bash' > savecode
        echo 'echo "⏳ Saving ALL BOTS to GitHub..."' >> savecode
        echo 'mv /tmp/.github_hidden ./.github' >> savecode
        echo 'git add .' >> savecode
        echo 'git commit -m "💾 Auto-saved Multi-Bot Empire [skip ci]" || echo "No changes to save."' >> savecode
        echo 'git push origin HEAD || echo "⚠️ Push failed! Check PAT_TOKEN."' >> savecode
        echo 'mv ./.github /tmp/.github_hidden' >> savecode
        echo 'echo "✅ Save Process Completed for all bots!"' >> savecode

        sudo mv savecode /usr/local/bin/savecode
        sudo chmod +x /usr/local/bin/savecode

    - name: 🔒 Set SSH Password
      run: |
        echo "runner:${{ secrets.SSH_PASSWORD }}" | sudo chpasswd
        sudo usermod -aG sudo runner

    # --- 🚀 ADVANCED MULTI-BOT ENGINE ---
    - name: 🚀 Auto-Detect & Start All Bots (PM2)
      env:
        MONGODB: ${{ secrets.MONGODB }}
        MODS: ${{ secrets.MODS }}
        SESSION_ID: ${{ secrets.SESSION_ID }}
        PACKNAME: ${{ secrets.PACKNAME }}
      run: |
        echo "🔍 Scanning for Bot Folders..."
        BOT_LIST=""

        for dir in */ ; do
          if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
            BOT_NAME=$(basename "$dir")

            if [ -z "$BOT_LIST" ]; then
              BOT_LIST="$BOT_NAME"
            else
              BOT_LIST="$BOT_LIST, $BOT_NAME"
            fi

            echo "⚙️ Initializing Bot: $BOT_NAME"
            cd "$dir"

            if grep -q '"bun":' package.json; then
              echo "🥟 Bun detected, installing with Bun..."
              bun install

              if [ -f "src/main.js" ]; then
                pm2 start "bun run --smol src/main.js" --name "$BOT_NAME"
              else
                pm2 start "bun start" --name "$BOT_NAME"
              fi
            else
              echo "🟢 Node detected, installing with NPM..."
              npm install
              if [ -f "index.js" ]; then
                pm2 start index.js --name "$BOT_NAME"
              else
                pm2 start npm --name "$BOT_NAME" -- start
              fi
            fi
            cd ..
          fi
        done
        pm2 save
        echo "ACTIVE_BOTS=${BOT_LIST:-No bots found!}" >> $GITHUB_ENV

    # --- 🌐 WEB PANELS (now password protected) ---
    - name: 🌐 Start Web Panels & Btop
      env:
        PANEL_PASS: ${{ secrets.SSH_PASSWORD }}
      run: |
        set +e

        # File Browser with login (admin / SSH_PASSWORD). Password min 12 characters.
        filebrowser config init -d /tmp/filebrowser.db > /tmp/fb_init.log 2>&1
        filebrowser users add admin "$PANEL_PASS" --perm.admin -d /tmp/filebrowser.db >> /tmp/fb_init.log 2>&1
        filebrowser -a 0.0.0.0 -p 8080 -r . -d /tmp/filebrowser.db > /tmp/filebrowser.log 2>&1 &

        # btop read-only + login (admin / SSH_PASSWORD)
        ttyd -R -c "admin:$PANEL_PASS" -p 61208 btop > /tmp/btop.log 2>&1 &

        sleep 20

        cloudflared tunnel --url http://127.0.0.1:8080 > /tmp/cf_file.log 2>&1 &
        cloudflared tunnel --url http://127.0.0.1:61208 > /tmp/cf_btop.log 2>&1 &

        sleep 30

        FILE_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cf_file.log | head -n 1)
        BTOP_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cf_btop.log | head -n 1)

        echo "FILE_MANAGER_URL=${FILE_URL:-Wait and Refresh}" >> $GITHUB_ENV
        echo "BTOP_URL=${BTOP_URL:-Wait and Refresh}" >> $GITHUB_ENV

    # --- 🔄 TMATE SSH & DISCORD ALERT (FIXED) ---
    - name: 🔄 Start Tmate Loop & Discord Alert
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        set +e

        # Webhook URL se space/newline hata do
        WEBHOOK=$(printf '%s' "$DISCORD_WEBHOOK" | tr -d '[:space:]')
        if [ -z "$WEBHOOK" ]; then
          echo "❌ DISCORD_WEBHOOK secret khaali hai!"
        fi

        # tmate config (session banne se PEHLE likhna zaroori hai)
        echo "set -g status off" > ~/.tmate.conf
        echo "set-option -g default-command \"export PS1='\[\033[01;32m\]Virtual Private Server \[\033[01;34m\]❯ \[\033[00m\] '; bash\"" >> ~/.tmate.conf
        echo "export PS1='\[\033[01;32m\]VPS:\[\033[01;34m\]\$(echo \W | sed \"s/reimagined-octo-disco/Main-Root/\") \[\033[01;32m\]❯ \[\033[00m\] '" >> ~/.bashrc

        for i in {1..15}; do
           echo "🔁 Tmate attempt $i"
           tmate -S /tmp/tmate.sock kill-server 2>/dev/null || true
           tmate -S /tmp/tmate.sock new-session -d

           # 60 sec se zyada wait nahi karega (pehle yahin atak jata tha)
           timeout 60 tmate -S /tmp/tmate.sock wait tmate-ready || { echo "⚠️ tmate ready nahi hua, retry..."; sleep 5; continue; }

           SSH_MSG=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null)
           echo "SSH_MSG=$SSH_MSG"

           if [[ "$SSH_MSG" == *"tmate.io"* ]]; then

              # Message 2000 characters se chhota rakha hai (Discord limit)
              MSG=$(cat <<EOF
        ✨ **VPS Dashboard 02** ✨

        ✅ **Status:** \`Online\` 🟢
        🤖 **Active Bots:** \`${ACTIVE_BOTS}\`

        📂 **File Manager:** ${FILE_MANAGER_URL}
        📊 **VPS Health:** ${BTOP_URL}
        🔑 **Panel Login:** \`admin\` / SSH_PASSWORD secret
        💻 **SSH:** \`${SSH_MSG}\`

        🛠️ **Commands**
        💾 \`savecode\` → GitHub par save (session khatam hone se pehle zaroor)
        📦 \`unzip "file.zip"\` → bot extract
        🗑️ \`rm "file.zip"\` → zip delete
        📝 \`pm2 logs Name\` → logs / QR
        🔄 \`pm2 restart Name\` → restart
        🛑 \`pm2 stop Name\` → stop
        📈 \`pm2 status\` → sab bots

        💡 Help: https://wa.me/918434573266
        EOF
              )

              PAYLOAD=$(jq -n --arg content "$MSG" '{content: $content}')

              # HTTP code print hoga: 204 = success, 404/401 = webhook galat, 400 = message issue
              curl -sS -w "\nDiscord HTTP: %{http_code}\n" -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"

              echo "RESTART_SAFE=true" >> $GITHUB_ENV

              for m in {1..36}; do sleep 300; done

              savecode || true
              exit 0
           fi
           sleep 5
        done

        curl -sS -w "\nDiscord HTTP: %{http_code}\n" -H "Content-Type: application/json" -d '{"content": "❌ **ERROR:** Tmate Server failed. Auto-restart paused."}' "$WEBHOOK"
        exit 1

    - name: 🧟 Respawn Zombie
      if: env.RESTART_SAFE == 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.PAT_TOKEN }}
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'marin.yml',
            ref: 'main'
          })
